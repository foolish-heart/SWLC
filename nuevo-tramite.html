<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Nuevo trámite | SWLC</title>
        <link rel="stylesheet" href="css/tramites.css">
    </head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    </style>

    <script type="module" src="scripts/nuevoTramite.js"></script>
    <script type="module" src="scripts/account.js"></script>

    <body>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
            </ul>
        </nav>

        <section id="numero-tramite">
            <div class="containerTramite">
                <span>Número de trámite:</span>
                <span class ="num" id="numTramite"></span>
            </div>
        </section>

        <article>
            <section id="datos-usuario">
                <div class="containerDatos">
                    <div class="tittle">
                        <h1>Datos</h1>
                    </div>
                        
                    <div class="text">
                        <h3>Por favor verifique los datos: </h3>
                        <p>Nombres: <span class="info" id="loggedUserNames"></span></p>
                        <p>Apellidos: <span class="info" id="loggedUserApellidos"></span></p>
                        <p>Email: <span class="info" id="loggedUserEmail"></span></p>
                        <h3>Si los datos no son correctos, revise la pagina de <a href="account.html">cuenta</a>.</h3>
                    </div>
                </div>
            </section>
        
            <section id="camara">
                <div class="containerCamara">
                    <div class="tittle">
                        <h1>Fotografía</h1>
                    </div>
                
                    <img id="foto" class="foto"/>

                    <video id="video" autoplay playsinline></video>
                    <canvas id="canvas" style="display:none;"></canvas>
                
                    <div class="buttoncontainer">
                        <button class="button" id="btnCamara">Iniciar cámara</button><button class="button" id="tomarFoto">Tomar foto</button>
                    </div>
                </div>
            </section>
        </article>

        <article>
            <section id="tipo-tramite">
                <div class="containerSelect">
                    <div class="tittle">
                        <h2>Tipo de Trámite:</h2>
                    </div>
                
                    <select id="select" class="select">
                        <option value="" disabled selected>Seleccione un trámite</option>
                        <option value="nuevaLicencia">Nueva Licencia</option>
                        <option value="renovacion">Renovación</option>
                        <option value="renovacionAscenso">Renovación y ascenso</option>
                        <option value="duplicado">Duplicado</option>
                    </select>
                </div>
            </section>

            <section class="containerUpload" id="subir-foto">
                    <label for="inputArchivo">Subir fotografia</label>
                    <input type="file" id="inputArchivo" accept="image/*">
            </section>
        </article>

        <div id="btnSiguiente" class="buttonSig">
            <p>Siguiente</p>
        </div>

    </body>
</html>
