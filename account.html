<!DOCTYPE html>
<html lang="es">

    <head>
        <title>Cuenta | SWLC</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/account.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    </head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    </style>

    <script type="module" src="scripts/account.js"></script>

    <body>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>

                <button class="login" id="logout">Cerrar Sesión</button>
                <!-- <li id="authContainer"></li> -->
                <!-- <button onclick="window.location.href='login.html'" class="login">Iniciar Sesión</button> -->
            </ul>
        </nav>

        <section>
            <article class="container">
                <div class="tittle">
                    <h1>Configuración de Cuenta</h1>
                </div>

                <div class="text">
                    <p>Nombres:
                        <span id="loggedUserNames"></span>
                        <input type="text" id="editNombres" style="display:none;">
                    </p>

                    <p>Apellidos:
                        <span id="loggedUserApellidos"></span>
                        <input type="text" id="editApellidos" style="display:none;">
                    </p>

                    <p>Email:
                        <span id="loggedUserEmail"></span>
                        <input type="email" id="editEmail" style="display:none;" disabled>
                    </p>
                </div>
                
                <div class="buttons">
                    <button id="btnEditar">Editar</button>
                    <button id="btnGuardar" style="display:none">Guardar cambios</button>
                    <button id="btnCancelar" style="display:none">Cancelar</button>
                </div>
                
            </article>

            <article class="container2">
                <div class="title2">
                    <h1>Historial</h1>
                </div>

                <table id="tablaHistorial" border="1">
                    <thead>
                        <tr>
                            <th>Número de trámite</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>

                    <tbody id="historialBody">
        
                    </tbody>
                </table>

            </article>

        </section>
        
    </body>
</html>
