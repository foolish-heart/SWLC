<!DOCTYPE html>
<html lang="es">

    <head>
        <title>Administrador | SWLC</title>
        <link rel="stylesheet" href="css/login.css">
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/admin.css">
    </head>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@700&display=swap');
    </style>

    <body>
        <nav>
            <ul>
                <button class="login" id="logout">Cerrar Sesión</button>
                <!-- <li id="authContainer"></li> -->
                <!-- <button onclick="window.location.href='login.html'" class="login">Iniciar Sesión</button> -->
            </ul>
        </nav>

        <section>
            <article class="tableContainer">
                <div class="tittle">
                    <h1>Página de administrador</h1>
                    <h3>Tramites registrados</h3>
                </div>

                <div class="search">
                    <input class="search" type="text" id="searchInput" placeholder="Busqueda">
                    
                    <select id="estadoFiltro" style="padding: 8px; font-size: 16px;">
                        <option value="todos">Todos</option>
                        <option value="pendiente">Pendiente</option>
                        <option value="aprobado">Aprobado</option>
                        <option value="denegado">Denegado</option>
                    </select>
                </div>


                <table>
                    <thead>
                        <tr>
                            <th>N° Trámite</th>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Estado</th>
                            <th>Archivos</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tramiteList"></tbody>

                </table>
            </article>
        </section>

        <script type="module" src="scripts/admin.js"></script>

        <script type="text/javascript"
        src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js">
        </script>
        <script type="text/javascript">
           (function(){
              emailjs.init({
                publicKey: "mPy0BZR6sbpuJLbdX",
              });
           })();
        </script>

    </body>
</html>
